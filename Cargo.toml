[workspace]
resolver = "2"
members = ["crates/ide-core", "crates/ide-app", "crates/ide-mcp"]
exclude = ["vendor/wry"]

[workspace.package]
license = "Apache-2.0"

[workspace.dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dirs = "5"
reqwest = { version = "0.13", default-features = false, features = ["blocking", "default-tls", "query"] }
uuid = { version = "1", features = ["v4", "serde"] }
tokio = { version = "1", features = ["rt", "rt-multi-thread", "sync", "net", "time"] }
axum = { version = "0.8", features = ["ws"] }
async-channel = "2"
crossbeam-channel = "0.5"
turso = { version = "=0.7.0-pre.14", default-features = false }
zip = { version = "0.6.6", default-features = false, features = ["deflate"] }
sha2 = "0.10"
git2 = "0.21"
notify = "7"
smol = "2"
mongodb = { version = "3", features = ["sync"] }
postgres = { version = "0.19", features = ["with-serde_json-1"] }
postgres-native-tls = "0.5"
native-tls = "0.2"
mysql = { version = "26.0.1", default-features = false, features = ["minimal-rust", "rustls-tls-ring"] }
rusqlite = "0.40"
url = "2"
aho-corasick = "1"
ignore = "0.4"
regex = "1"
image = "0.25"
agent-client-protocol = "0.15"
libc = "0.2"

gpui = "0.2.2"
gpui-component = { path = "vendor/gpui-component", features = ["tree-sitter-languages"] }
gpui-terminal = { path = "vendor/gpui-terminal" }
velotype = { path = "vendor/velotype" }
portable-pty = "0.9"
parking_lot = "0.12"

ide-core = { path = "crates/ide-core" }

[patch.crates-io]
# block 0.1.6 models an external Objective-C class as an uninhabited type,
# which future Rust versions reject. Keep its API and runtime behavior intact
# while making the opaque marker inhabited.
block = { path = "vendor/block" }
# Wry 0.52.1 swallows unhandled macOS keyDown events in its WKWebView parent,
# which makes keyboard-driven web apps such as Penpot effectively read-only.
# This local copy backports upstream PR #1711 without taking unrelated
# unreleased Wry changes.
wry = { path = "vendor/wry" }
smart-turn-rs = { path = "vendor/smart-turn-rs" }

# Optimize dependencies (gpui is heavy) once; keep our code fast to rebuild.
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
opt-level = 2
