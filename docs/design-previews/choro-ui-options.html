document.addEventListener('keydown',e=>{if(!state.proposed||$('source-dialog').open)return;if((e.metaKey||e.ctrlKey)&&e.key.toLowerCase()==='b'&&!e.altKey){e.preventDefault();if(e.shiftKey)toggleTools();else{state.leftOpen=!state.leftOpen;render();restoreFocus('#left-sidebar-toggle');}}});
$('header-separators').onchange=e=>{state.separators=e.target.checked;render();};
$('reopen').onclick=()=>{for(const entry of projectSessions.values())entry.panels={Agents:false};state.activity='Agents';state.leftOpen=true;state.git='compact';state.mic=false;state.diff=null;state.feedback='New session: Git starts hidden for every project.';render(false);};
$('source-open').onclick=()=>$('source-dialog').showModal();$('source-close').onclick=()=>$('source-dialog').close();$('source-dialog').addEventListener('click',e=>{if(e.target===$('source-dialog')){let r=e.target.getBoundingClientRect();if(e.clientX<r.left||e.clientX>r.right||e.clientY<r.top||e.clientY>r.bottom)e.target.close();}});
